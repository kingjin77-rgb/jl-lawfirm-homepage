<script type="text/javascript">

$("#tmp_dong, #tmp_ho").keyup(function() {
	val=$(this).val();
	re=/[^0-9]/gi;
	$(this).val(val.replace(re,""));
});



function login_confirm(){
	if(!$("select[name='m_group']").val()){
		alert("아파트를 선택해 주세요.");
		$("select[name='m_group']").focus();
		return false;
	}
	if(!$("input[name='tmp_dong']").val()){
		alert("동을 입력하세요.");
		$("input[name='tmp_dong']").focus();
		return false;
	}
	
	if(!$("input[name='tmp_ho']").val()){
		alert("호수를 입력하세요.");
		$("input[name='tmp_ho']").focus();
		return false;
	}

	if(!$("input[name='tmp_name']").val()){
		alert("이름을 입력하세요.");
		$("input[name='tmp_name']").focus();
		return false;
	}

	if(!$("input[name='tmp_birth']").val()){
		alert("주민등록번호 앞자리를 입력하세요.");
		$("input[name='tmp_birth']").focus();
		return false;
	}

	document.frm.submit();
}

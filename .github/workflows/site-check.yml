name: 홈페이지 점검

# 파일이 바뀐 PR에서 기본적인 실수를 잡는다.
# - 사이트 내부 링크·앵커 깨짐
# - 참조하는 이미지·문서 파일 누락
# - data/*.json 과 구조화 데이터 JSON 문법 오류
# - 동작하지 않는 빈 링크

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 파일 문법 검사
        run: |
          python - <<'PY'
          import json, glob, sys
          bad = 0
          for p in sorted(glob.glob('data/*.json')):
              try:
                  json.load(open(p, encoding='utf-8'))
                  print('OK  ', p)
              except json.JSONDecodeError as e:
                  print('오류', p, e); bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: 링크 · 앵커 · 구조화 데이터 점검
        run: python tools/check.py

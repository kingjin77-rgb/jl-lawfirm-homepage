name: 채권 할인율 갱신

# 제1종 국민주택채권 즉시매도 할인율은 영업일마다 바뀐다.
# 등기비용 계산기가 이 값을 쓰므로 매일 아침 받아와 data/registry.json 을 갱신한다.
# 받아온 값이 이상하면 스크립트가 스스로 갱신을 건너뛴다.

on:
  schedule:
    # 평일 08:30 KST (UTC 23:30 전날). 채권 시세는 영업일 오전에 게시된다.
    - cron: '30 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bond-rate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 할인율 수집
        run: python tools/fetch_bond_rate.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/registry.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry.json
          git commit -m "채권 할인율 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push

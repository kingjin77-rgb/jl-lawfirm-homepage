name: 법률정보 피드 갱신

# 법제처 국가법령정보 Open API에서 법령 개정·판례를 수집해
# data/law-feed.json 을 갱신하고, 변경이 있을 때만 커밋한다.

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:        # 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 피드 생성
        env:
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
        run: python tools/fetch_law_feed.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/law-feed.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/law-feed.json
          git commit -m "법률정보 피드 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
